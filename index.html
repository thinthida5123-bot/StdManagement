<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen relative">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">🎓 Student Admin Panel</h1>
        
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <section class="bg-white p-6 rounded-lg shadow-sm h-fit">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Add New Student</h2>
            <form id="studentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
                    <input type="text" id="studentName" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Roll Number / ID</label>
                    <input type="text" id="studentRoll" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Class / Major</label>
                    <input type="text" id="studentClass" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Date of Birth</label>
                    <input type="date" id="studentDOB" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition duration-200 text-sm">
                    Save Student
                </button>
            </form>
        </section>

        <section class="md:col-span-2 bg-white p-6 rounded-lg shadow-sm">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Student Directory</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b">
                            <th class="py-3 px-4 cursor-pointer hover:bg-gray-100 select-none" onclick="toggleSort()">
                                Roll/ID <span id="sortIcon">↕️</span>
                            </th>
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3 px-4">Class</th>
                            <th class="py-3 px-4">DOB</th>
                            <th class="py-3 px-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="text-gray-700 text-sm divide-y"></tbody>
                </table>
                <div id="emptyState" class="text-center py-8 text-gray-400 hidden">
                    No students registered yet.
                </div>
            </div>
        </section>
    </main>

    <div id="undoToast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-xl flex items-center space-x-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <span id="toastMessage">Student deleted.</span>
        <button onclick="triggerUndo()" class="text-yellow-400 hover:text-yellow-300 font-bold underline text-sm focus:outline-none">
            Undo
        </button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
